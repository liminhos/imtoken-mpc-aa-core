[workspace]
members = [
    "core-crypto",
    "aa-engine",
    "ext-bridge"
]
resolver = "2"

[workspace.package]
version = "1.4.0"
authors = ["Sovereign Cryptographic Labs <research@sovereign-labs.internal>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/imtoken-mpc-aa-core"
rust-version = "1.75.0"

[workspace.dependencies]
# Low-level cryptography crates optimized for zero-dependency embedded targets
curve25519-dalek = { version = "4.1.1", default-features = false, features = ["alloc"] }
signature = { version = "2.2.0", default-features = false }
num-bigint = { version = "0.4.4", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
